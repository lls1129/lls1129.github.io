name: Build LaTeX to Website

on:
  push:
    branches: ["main"]  # Triggers when you sync Overleaf

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      # THE NEW ROBUST CONVERSION STEP
      # 1. We stay in root (no 'cd')
      # 2. We tell pandoc: "The main file is at src/main.tex"
      # 3. We tell pandoc: "If you need other files (inputs/images), look in 'src'" (--resource-path=src)
      - name: Convert LaTeX to HTML
        run: |
          cd src
          pandoc main.tex -o ../index.html --standalone --toc --mathjax
      # pandoc main.tex --resource-path=src -o index.html --standalone --toc --mathjax

      # DEBUG STEP: This will print the file list in your logs so we can see if index.html exists
      - name: Verify file generation
        run: ls -la

      - name: Commit and Push changes
        run: |
          git config --global user.name 'GitHub Action'
          git config --global user.email 'action@github.com'
          git add index.html
          # The flag --allow-empty prevents failure if the file is identical to the last run
          git commit -m "Auto-update website" --allow-empty
          git push origin HEAD:main